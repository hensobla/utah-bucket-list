name: Deploy to GitHub Pages

# Runs on every push to main: stamps a human-readable, auto-incrementing
# build number into the page (no manual editing, ever) and deploys the
# result to GitHub Pages. Replaces the old "serve the branch directly"
# Pages mode, which had no way to inject anything at deploy time.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build version
        # github.run_number auto-increments on every run of *this*
        # workflow — 1, 2, 3, ... — with no bookkeeping required. That
        # becomes the human-readable "v<N>" shown at the bottom of the page.
        run: sed -i "s/__BUILD_VERSION__/${{ github.run_number }}/" index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
